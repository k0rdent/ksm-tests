name: Bash Lint

on:
  push:
    paths:
      - '**/*.sh'
      - .github/workflows/lint-bash.yml
  pull_request:
    paths:
      - '**/*.sh'
      - .github/workflows/lint-bash.yml

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh scripts/tests/bash/*.sh
