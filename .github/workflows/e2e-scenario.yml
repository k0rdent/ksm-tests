name: E2E scenario

# Reusable: one scenario across every KCM variant, called once per scenario by
# e2e.yml. Known failures are handled by scripts/ci_step.sh, not
# continue-on-error; the marker reaches this file only to label the job name.

on:
  workflow_call:
    inputs:
      scenario:
        description: 'Scenario id (test_scenarios/<id>.yaml)'
        type: string
        required: true
      kcm_variants:
        description: 'JSON array of KCM variants, from the discover job'
        type: string
        required: true
      known_failing_kcm:
        description: 'Space-separated variant ids this scenario is known to fail on'
        type: string
        required: false
        default: ''
      kcm_ref:
        description: 'Override the KCM ref (source mode only)'
        type: string
        required: false
        default: ''
      keep_cluster:
        description: 'Skip cleanup, for debugging'
        type: boolean
        required: false
        default: false

# No concurrency group here on purpose: the caller's cancels these jobs too.

jobs:
  e2e:
    name: ${{ matrix.kcm.name }}${{ contains(inputs.known_failing_kcm, matrix.kcm.id) && ' ⚠ known failure' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kcm: ${{ fromJson(inputs.kcm_variants) }}
    env:
      # common.sh expands KCM via kcm-variants.yaml, the same file a local run
      # reads, so the mapping is not duplicated here.
      KCM: ${{ matrix.kcm.id }}
      KCM_REF: ${{ inputs.kcm_ref }}
      SCENARIO: ${{ inputs.scenario }}
      TEST_MODE: adopted
      # No scenario here: each combination has its own runner, and MCS_NAME
      # already carries the scenario slug.
      RUN_ID: ci${{ github.run_id }}-${{ matrix.kcm.id }}
    steps:
      - uses: actions/checkout@v7

      # runner.* is not available in job-level env, so DEBUG is set here.
      - name: Enable debug output
        if: runner.debug == '1'
        run: echo "DEBUG=true" >> "$GITHUB_ENV"

      # The build, two images and two k0s clusters outgrow the runner disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      # KCM's Makefile shells out to `go env` while parsing. The binaries are
      # built inside Docker, so a module cache here would not help.
      - uses: actions/setup-go@v7
        if: matrix.kcm.source == 'source'
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        run: ./scripts/deps.sh

      - name: Prepare KCM
        run: ./scripts/prepare_kcm.sh

      # The local registry only serves charts we built ourselves.
      - name: Deploy local registry
        if: matrix.kcm.source == 'source'
        run: ./scripts/deploy_registry.sh

      - name: Deploy management cluster
        run: ./scripts/deploy_mgmt_cluster.sh

      - name: Push images and charts
        if: matrix.kcm.source == 'source'
        run: ./scripts/push_kcm_artifacts.sh

      - name: Install KCM
        run: ./scripts/deploy_kcm.sh

      - name: Apply Release and templates
        run: ./scripts/apply_release.sh

      - name: Wait for templates
        run: ./scripts/wait_for_templates.sh

      - name: Apply Management
        run: ./scripts/apply_management.sh

      - name: Wait for Management
        run: ./scripts/wait_for_management.sh

      - name: Deploy the cluster to adopt
        run: ./scripts/deploy_adopted_cluster.sh

      - name: Adopt the cluster
        run: ./scripts/adopt_cluster.sh

      - name: Install ServiceTemplates
        run: ./scripts/ci_step.sh "Install ServiceTemplates" ./scripts/install_servicetemplate.sh

      - name: Deploy services via MultiClusterService
        run: ./scripts/ci_step.sh "Deploy services via MultiClusterService" ./scripts/deploy_mcs.sh

      # No-op unless the scenario has an upgrade block.
      - name: Upgrade services
        run: ./scripts/ci_step.sh "Upgrade services" ./scripts/upgrade_services.sh

      # No-op unless the scenario declares upgrade.steps.
      - name: Upgrade along the chain
        run: ./scripts/ci_step.sh "Upgrade along the chain" ./scripts/upgrade_chain.sh

      - name: Remove services
        run: ./scripts/ci_step.sh "Remove services" ./scripts/remove_services.sh

      - name: Remove ClusterDeployment
        run: ./scripts/remove_cld.sh

      - name: Uninstall KCM
        run: ./scripts/remove_kcm.sh

      - name: Collect diagnostics
        if: failure()
        run: ./scripts/collect_logs.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}-${{ inputs.scenario }}-${{ matrix.kcm.id }}
          path: logs*/
          retention-days: 7

      - name: Cleanup
        if: always() && !inputs.keep_cluster
        run: ./scripts/cleanup.sh
