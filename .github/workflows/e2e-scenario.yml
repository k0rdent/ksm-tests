name: E2E scenario

# Reusable: one scenario across every KCM variant, called once per scenario by
# e2e.yml. The pipeline itself lives in the two entry points the README
# documents, so CI runs exactly what a local run does.

on:
  workflow_call:
    inputs:
      scenario:
        description: 'Scenario id (test_scenarios/<id>.yaml)'
        type: string
        required: true
      kcm_variants:
        description: 'JSON array of KCM variants, from the discover job'
        type: string
        required: true
      has_upgrade:
        description: 'The scenario declares upgrade.services'
        type: boolean
        required: false
        default: true
      has_chain:
        description: 'The scenario declares upgrade.steps'
        type: boolean
        required: false
        default: true
      src_url:
        description: 'Override the KCM repository to build (source mode only)'
        type: string
        required: false
        default: ''
      oci_url:
        description: 'Override the chart registry (release mode only)'
        type: string
        required: false
        default: ''

# No concurrency group here on purpose: the caller's cancels these jobs too.

jobs:
  e2e:
    # The name already says which ref and commit a source build uses: discover
    # resolves it, because a job name is fixed before the job can clone.
    name: ${{ matrix.kcm.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kcm: ${{ fromJson(inputs.kcm_variants) }}
    env:
      # A chart version in release mode, a git ref in source mode -- the same
      # single knob a local run uses.
      KCM: ${{ matrix.kcm.kcm }}
      KCM_MODE: ${{ matrix.kcm.mode }}
      # Empty falls through to the default in common.sh.
      SRC_URL: ${{ inputs.src_url }}
      OCI_URL: ${{ inputs.oci_url }}
      SCENARIO: ${{ inputs.scenario }}
      TEST_MODE: self
    steps:
      - uses: actions/checkout@v7

      # runner.* is not available in job-level env, so DEBUG is set here.
      - name: Enable debug output
        if: runner.debug == '1'
        run: echo "DEBUG=true" >> "$GITHUB_ENV"

      # Only the source build outgrows the runner disk: it adds two images and
      # a local registry on top of the cluster. A release job starts with 87G
      # free, and the cleanup costs 99s -- a quarter of its environment time.
      - name: Free disk space
        if: matrix.kcm.mode == 'source'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      # KCM's Makefile shells out to `go env` while parsing. The binaries are
      # built inside Docker, so a module cache here would not help.
      - uses: actions/setup-go@v7
        if: matrix.kcm.mode == 'source'
        with:
          go-version: 'stable'
          cache: false

      # One step per script, so the step list says where a run failed without
      # anyone opening a log. deploy_k0rdent.sh runs the same sequence for a
      # local run; nothing enforces that the two stay in step, so a script
      # added there has to be added here too.
      - name: Install dependencies
        run: ./scripts/deps.sh

      - name: Prepare KCM
        run: ./scripts/prepare_kcm.sh

      # The local registry only serves charts we built ourselves.
      - name: Deploy local registry
        if: matrix.kcm.mode == 'source'
        run: ./scripts/deploy_registry.sh

      - name: Deploy k0rdent cluster
        run: ./scripts/deploy_mgmt_cluster.sh

      - name: Push images and charts
        if: matrix.kcm.mode == 'source'
        run: ./scripts/push_kcm_artifacts.sh

      - name: Install KCM
        run: ./scripts/deploy_kcm.sh

      - name: Apply Release and templates
        run: ./scripts/apply_release.sh

      - name: Wait for templates
        run: ./scripts/wait_for_templates.sh

      - name: Apply Management
        run: ./scripts/apply_management.sh

      - name: Wait for Management
        run: ./scripts/wait_for_management.sh

      - name: Install ServiceTemplates
        run: ./scripts/install_servicetemplate.sh

      - name: Deploy services via MultiClusterService
        run: ./scripts/deploy_mcs.sh

      # Skipped, not silently a no-op: most scenarios declare no upgrade, and a
      # green step that did nothing reads as coverage this run does not have.
      - name: Upgrade services
        if: inputs.has_upgrade
        run: ./scripts/upgrade_services.sh

      - name: Upgrade along the chain
        if: inputs.has_chain
        run: ./scripts/upgrade_chain.sh

      - name: Remove services
        run: ./scripts/remove_services.sh

      - name: Collect diagnostics
        if: failure()
        run: ./scripts/collect_logs.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}-${{ inputs.scenario }}-${{ matrix.kcm.id }}
          path: logs*/
          retention-days: 7

      - name: Remove the k0rdent cluster
        if: always()
        run: ./scripts/remove_k0rdent.sh
