name: E2E

on:
  workflow_dispatch:
    inputs:
      kcm_ref:
        description: 'KCM branch, tag or SHA to test (source mode only)'
        required: false
        default: ''
      keep_cluster:
        description: 'Skip cleanup (for debugging)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC
  push:
    branches:
      - '**'
    paths:
      - 'scripts/**'
      - .github/workflows/e2e.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/**'
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-docker:
    name: ${{ matrix.kcm.name }} / ${{ matrix.service_set }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # KCM 1.11.0 cannot tear the kserve stack down: sveltos removes kserve-crd
    # before uninstalling kserve-resources, whose release still holds a
    # ClusterStorageContainer, so the uninstall fails with "ensure CRDs are
    # installed first" and the MultiClusterService finalizer never clears.
    # Reproduced on every run; 1.10.0 and main are unaffected, and catalog
    # itself sets test_remove_multiclusterservice: false for kserve. The job
    # still runs and still reports -- it just does not block the workflow.
    continue-on-error: >-
      ${{ matrix.kcm.id == 'rel-1-11-0' && matrix.service_set == 'kserve' }}
    # Nightly runs only when the repo opts in, matching k0rdent/catalog.
    if: github.event_name != 'schedule' || vars.ENABLE_CRON == '1'
    strategy:
      fail-fast: false
      matrix:
        # GitHub Actions cannot fork a job mid-run: every combination gets its
        # own runner and builds its own cluster from scratch. That is what makes
        # these genuinely independent -- a service set that wedges the cluster
        # cannot affect the other one.
        kcm:
          # KCM built from the checkout -- tests the code under review.
          - name: 'src: main'
            id: src-main
            source: source
            ref: main
            release_version: ''
          # Published charts -- tests what users actually install.
          - name: 'release: 1.11.0'
            id: rel-1-11-0
            source: release
            ref: ''
            release_version: '1.11.0'
          - name: 'release: 1.10.0'
            id: rel-1-10-0
            source: release
            ref: ''
            release_version: '1.10.0'
        service_set: [traefik, kserve]
    env:
      KCM_SOURCE: ${{ matrix.kcm.source }}
      # Empty lets common.sh pick the tag matching KCM_RELEASE_VERSION;
      # overriding it in release mode would trip the version check.
      KCM_REF: ${{ github.event.inputs.kcm_ref || matrix.kcm.ref }}
      KCM_RELEASE_VERSION: ${{ matrix.kcm.release_version }}
      SERVICE_SET: ${{ matrix.service_set }}
      TEST_MODE: docker
      # Distinct per matrix leg so the jobs never share cluster or container
      # names, even on the same runner. Must stay valid in a docker tag and a
      # Kubernetes object name, hence the slug rather than matrix.kcm.name.
      RUN_ID: ci${{ github.run_id }}-${{ matrix.kcm.id }}-${{ matrix.service_set }}
    steps:
      - uses: actions/checkout@v7

      # The runner context is not available in job-level env, so DEBUG is set
      # here instead: re-running with debug logging turns on verbose output.
      - name: Enable debug output
        if: runner.debug == '1'
        run: echo "DEBUG=true" >> "$GITHUB_ENV"

      # The Go build, two container images, k0s and the CAPD nodes together
      # outgrow the default runner disk.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      # KCM's Makefile shells out to `go env` while parsing, so go must be on
      # PATH for the source build. The binaries themselves are built inside
      # Docker, so a Go module cache here would not help.
      - uses: actions/setup-go@v7
        if: matrix.kcm.source == 'source'
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        run: ./scripts/deps.sh

      - name: Prepare KCM
        run: ./scripts/prepare_kcm.sh

      # The local registry only serves charts we built ourselves.
      - name: Deploy local registry
        if: matrix.kcm.source == 'source'
        run: ./scripts/deploy_registry.sh

      - name: Deploy management cluster
        run: ./scripts/deploy_mgmt_cluster.sh

      - name: Install OpenEBS
        run: ./scripts/install_openebs.sh

      - name: Push images and charts
        if: matrix.kcm.source == 'source'
        run: ./scripts/push_kcm_artifacts.sh

      - name: Install KCM
        run: ./scripts/deploy_kcm.sh

      - name: Apply Release and templates
        run: ./scripts/apply_release.sh

      - name: Wait for templates
        run: ./scripts/wait_for_templates.sh

      - name: Apply Management
        run: ./scripts/apply_management.sh

      - name: Wait for Management
        run: ./scripts/wait_for_management.sh

      - name: Deploy ClusterDeployment
        run: ./scripts/deploy_cld.sh

      - name: Check child cluster
        run: ./scripts/check_child_cluster.sh

      - name: Install ServiceTemplates
        run: ./scripts/install_servicetemplate.sh

      - name: Deploy services via MultiClusterService
        run: ./scripts/deploy_mcs.sh

      - name: Remove MultiClusterService
        run: ./scripts/remove_mcs.sh

      - name: Remove ClusterDeployment
        run: ./scripts/remove_cld.sh

      - name: Uninstall KCM
        run: ./scripts/remove_kcm.sh

      - name: Collect diagnostics
        if: failure()
        run: ./scripts/collect_logs.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}-${{ matrix.kcm.id }}-${{ matrix.service_set }}
          path: logs*/
          retention-days: 7

      - name: Cleanup
        if: always() && github.event.inputs.keep_cluster != 'true'
        run: ./scripts/cleanup.sh
