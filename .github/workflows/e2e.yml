name: E2E

# Scenario first, KCM version second. Actions has no nested matrix, so the
# versions live in the reusable e2e-scenario.yml. Both dimensions are data --
# test_scenarios/*.yaml and kcm-variants.yaml -- so adding either is a YAML
# change with no workflow edit.

on:
  workflow_dispatch:
    inputs:
      # Empty means everything.
      scenarios:
        description: 'Scenarios to run, space or comma separated (empty = all)'
        required: false
        default: ''
      kcm:
        description: 'KCM variants to run, space or comma separated (empty = all)'
        required: false
        default: ''
      kcm_ref:
        description: 'KCM branch, tag or SHA to test (source mode only)'
        required: false
        default: ''
      keep_cluster:
        description: 'Skip cleanup (for debugging)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC
  # Only main: on a branch with an open PR a push runs everything a second
  # time, and the cancelled duplicate still shows on the PR as a failed check.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'test_scenarios/**'
      - .github/workflows/e2e.yml
      - .github/workflows/e2e-scenario.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/**'
      - 'test_scenarios/**'
      - .github/workflows/e2e.yml
      - .github/workflows/e2e-scenario.yml

# Grouped by branch, not github.ref, so a second push to a PR cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    # Nightly runs only when the repo opts in, matching k0rdent/catalog.
    if: github.event_name != 'schedule' || vars.ENABLE_CRON == '1'
    outputs:
      scenarios: ${{ steps.scan.outputs.scenarios }}
      kcm_variants: ${{ steps.scan.outputs.kcm_variants }}
    steps:
      - uses: actions/checkout@v7

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Scan scenarios and KCM variants
        id: scan
        # Via env, not inline interpolation: free-text dispatch input.
        env:
          WANT_SCENARIOS: ${{ github.event.inputs.scenarios }}
          WANT_KCM: ${{ github.event.inputs.kcm }}
        run: |
          set -euo pipefail

          # Empty selection means everything.
          selected() { # selected <id> <list>
            local id="$1" want
            [[ -z "${2// /}" ]] && return 0
            for want in ${2//,/ }; do [[ "$want" == "$id" ]] && return 0; done
            return 1
          }

          # Each entry carries the versions it is known to fail on, for the
          # job name.
          scenarios='[]'
          all_scenarios=''
          for f in test_scenarios/*.yaml; do
            id="$(basename "$f" .yaml)"
            all_scenarios+="$id "
            selected "$id" "$WANT_SCENARIOS" || continue
            known="$(yq -r '[.knownFailures[].kcm] | join(" ")' "$f")"
            scenarios="$(jq -c --arg id "$id" --arg known "$known" \
              '. + [{id: $id, knownFailingKcm: $known}]' <<< "$scenarios")"
          done

          variants='[]'
          all_variants=''
          while read -r id; do
            all_variants+="$id "
            selected "$id" "$WANT_KCM" || continue
            variants="$(yq -o=json -I=0 ".variants[] | select(.id == \"$id\")" \
              scripts/config/kcm-variants.yaml \
              | jq -c --argjson acc "$variants" '$acc + [.]')"
          done < <(yq -r '.variants[].id' scripts/config/kcm-variants.yaml)

          # A typo would otherwise mean an empty matrix and a green run that
          # tested nothing.
          [[ "$scenarios" == '[]' ]] && {
            echo "No scenario matches '$WANT_SCENARIOS'. Available: $all_scenarios" >&2; exit 1; }
          [[ "$variants" == '[]' ]] && {
            echo "No KCM variant matches '$WANT_KCM'. Available: $all_variants" >&2; exit 1; }

          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "kcm_variants=$variants" >> "$GITHUB_OUTPUT"
          echo "Scenarios:    $scenarios"
          echo "KCM variants: $variants"

  e2e:
    name: ${{ matrix.scenario.id }}
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.discover.outputs.scenarios) }}
    uses: ./.github/workflows/e2e-scenario.yml
    with:
      scenario: ${{ matrix.scenario.id }}
      kcm_variants: ${{ needs.discover.outputs.kcm_variants }}
      known_failing_kcm: ${{ matrix.scenario.knownFailingKcm }}
      kcm_ref: ${{ github.event.inputs.kcm_ref || '' }}
      keep_cluster: ${{ github.event.inputs.keep_cluster == 'true' }}
