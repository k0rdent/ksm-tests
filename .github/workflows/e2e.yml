name: E2E

# Scenario first, KCM version second. Actions has no nested matrix, so the
# versions live in the reusable e2e-scenario.yml. Both dimensions are data --
# test_scenarios/*.yaml and kcm-variants.yaml -- so adding either is a YAML
# change with no workflow edit.

on:
  workflow_dispatch:
    inputs:
      KCM:
        description: 'KCM version (chart version, branch, tag, sha)'
        required: false
        default: 1.12.0-rc.3
      KCM_MODE:
        description: 'KCM deployoment mode, options: source, release'
        required: false
        default: 'release'
      SRC_URL:
        description: 'KCM source git repository (kcm_mode: source)'
        required: false
        default: 'https://github.com/k0rdent/kcm.git'
      OCI_URL:
        description: 'KCM release oci url (kcm_mode: release)'
        required: false
        # The registry, not one chart in it: the scripts pull kcm and
        # kcm-templates from under this path.
        default: 'oci://ghcr.io/k0rdent/kcm/charts'
      scenarios:
        description: '(empty = all), e.g. "01_basic, 02dep01_valid"'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC
  # Only main: on a branch with an open PR a push runs everything a second
  # time, and the cancelled duplicate still shows on the PR as a failed check.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'test_scenarios/**'
      - .github/workflows/e2e.yml
      - .github/workflows/e2e-scenario.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/**'
      - 'test_scenarios/**'
      - .github/workflows/e2e.yml
      - .github/workflows/e2e-scenario.yml

# Grouped by branch, not github.ref, so a second push to a PR cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover
    runs-on: ubuntu-latest
    # Nightly runs only when the repo opts in, matching k0rdent/catalog.
    if: github.event_name != 'schedule' || vars.ENABLE_CRON == '1'
    outputs:
      scenarios: ${{ steps.scan.outputs.scenarios }}
    steps:
      # Full history: the pull-request selection diffs against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pick the scenarios and variants to run
        id: scan
        # Via env, not inline interpolation: free-text dispatch input.
        env:
          WANT_SCENARIOS: ${{ github.event.inputs.scenarios }}
          WANT_KCM: ${{ github.event.inputs.KCM }}
          WANT_KCM_MODE: ${{ github.event.inputs.KCM_MODE }}
          WANT_SRC_URL: ${{ github.event.inputs.SRC_URL }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail

          # A source build is named after what it will actually check out, not
          # after a ref that may have moved. The commit has to be resolved
          # here -- job names are fixed before any job clones anything.
          #   a branch or tag -> 'src: <ref> (<sha>)'
          #   a commit        -> 'src: <sha>'
          src_name() {
            local ref="$1" url="$2" sha
            sha="$(git ls-remote "$url" "$ref" 2>/dev/null | head -1 | cut -f1)"
            if [[ -n "$sha" ]]; then
              echo "src: $ref (${sha:0:8})"
            elif [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "src: ${ref:0:8}"          # the commit itself
            else
              # A ref this remote does not have. Shown whole rather than cut to
              # a fake sha, and the job fails on it instead of quietly testing
              # something else.
              echo "src: $ref"
            fi
          }

          all_ids=()
          for f in test_scenarios/*.yaml; do all_ids+=("$(basename "$f" .yaml)"); done

          for want in ${WANT_SCENARIOS//,/ }; do
            [[ " ${all_ids[*]} " == *" $want "* ]] \
              || { echo "Unknown scenario '$want'. Available: ${all_ids[*]}" >&2; exit 1; }
          done

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            # One KCM, the same single knob a local run takes. No matrix over
            # versions here: the scheduled and push runs are what cover the set.
            case "$WANT_KCM_MODE" in
              source|release) ;;
              *) echo "KCM_MODE must be 'source' or 'release', got '$WANT_KCM_MODE'" >&2
                 exit 1 ;;
            esac
            if [[ "$WANT_KCM_MODE" == "source" ]]; then
              VNAME="$(src_name "$WANT_KCM" "$WANT_SRC_URL")"
            else
              VNAME="release: $WANT_KCM"
            fi
            # The id reaches an artifact name, so keep it to safe characters.
            VID="${WANT_KCM//[^A-Za-z0-9._-]/-}"
            ALL="$(jq -nc --arg id "$VID" --arg n "$VNAME" \
                          --arg k "$WANT_KCM" --arg m "$WANT_KCM_MODE" \
                   '[{id: $id, name: $n, kcm: $k, mode: $m}]')"
          else
            ALL="$(yq -o=json -I=0 '.variants' scripts/config/kcm-variants.yaml)"
            DEFAULT_SRC_URL="$(KCM='' KCM_MODE=source bash -c \
              'source scripts/lib/common.sh; echo "$SRC_URL"')"
            while read -r vid vref; do
              [[ -n "$vid" ]] || continue
              ALL="$(jq -c --arg id "$vid" --arg n "$(src_name "$vref" "$DEFAULT_SRC_URL")" \
                '[ .[] | if .id == $id then . + {name: $n} else . end ]' <<< "$ALL")"
            done < <(jq -r '.[] | select(.mode == "source") | "\(.id) \(.kcm)"' <<< "$ALL")
          fi

          PR_VARIANT="$(jq -r '[.[] | select(.prCheck == true) | .id][0] // empty' <<< "$ALL")"
          SRC_VARIANT="$(jq -r '[.[] | select(.mode == "source") | .id][0] // empty' <<< "$ALL")"
          SMOKE=01_basic
          # Without it every pull request would select nothing and pass having
          # tested nothing.
          if [[ "$EVENT" == "pull_request" && -z "$PR_VARIANT" ]]; then
            echo "No variant in kcm-variants.yaml has prCheck: true" >&2
            exit 1
          fi

          # scenario -> the variant ids it should run against
          declare -A SEL
          add() {
            [[ " ${SEL[$1]:-} " == *" $2 "* ]] || SEL["$1"]="${SEL[$1]:-} $2"
          }
          add_all_variants() {
            local v
            while read -r v; do add "$1" "$v"; done < <(jq -r '.[].id' <<< "$ALL")
          }

          if [[ "$EVENT" == "pull_request" && "$FULL_LABEL" != "true" ]]; then
            # Only what the change could plausibly break. The whole matrix still
            # runs on main and nightly, so nothing is permanently untested.
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            echo "Changed files:"; awk '{print "  " $0}' <<< "$changed"

            # Which scenarios use a given feature is already in their files,
            # so a verification script maps to exactly the scenarios that run it.
            # if, not &&: a trailing false test would return non-zero and
            # set -e would kill the run.
            using() { local f; for f in test_scenarios/*.yaml; do
              if [[ "$(yq -r "$1" "$f")" == "true" ]]; then basename "$f" .yaml; fi
            done; }
            CHAIN='((.templateChain // .upgrade.steps) != null)'
            UPGRADE='(.upgrade.services != null)'
            MULTI='(.multiClusterServices != null)'
            EXPECT='(.expect.failed != null)'
            PLAIN='((.templateChain // .upgrade // .multiClusterServices // .expect) == null)'

            # One per feature area. Not `using ... | head -1`: head closes the
            # pipe, using dies of SIGPIPE and pipefail takes the whole script
            # down with it.
            one_of() {
              local out
              out="$(using "$1")"
              [[ -n "$out" ]] && head -1 <<< "$out"
              return 0
            }

            targeted="" source_build=false everything=false pipeline=false env_only=false
            while read -r f; do
              [[ -n "$f" ]] || continue
              case "$f" in
                test_scenarios/*.yaml)         targeted+=" $(basename "$f" .yaml)" ;;
                # Only ever run in source mode, so a release leg proves nothing.
                scripts/prepare_kcm.sh|scripts/push_kcm_artifacts.sh|scripts/deploy_registry.sh)
                                               source_build=true ;;
                scripts/upgrade_chain.sh)      targeted+=" $(using "$CHAIN" | tr '\n' ' ')" ;;
                scripts/upgrade_services.sh)   targeted+=" $(using "$UPGRADE" | tr '\n' ' ')" ;;
                scripts/deploy_mcs_group.sh)   targeted+=" $(using "$MULTI" | tr '\n' ' ')" ;;
                scripts/verify_mcs_failure.sh) targeted+=" $(using "$EXPECT" | tr '\n' ' ')" ;;
                # Step wiring: a step that is a no-op for one scenario is real
                # for another, so this needs one scenario per feature area.
                .github/workflows/*)           pipeline=true ;;
                # Values, templates, the cluster definition: these break every
                # scenario the same way, so one is enough to see it.
                scripts/config/*)              env_only=true ;;
                scripts/*)                     everything=true ;;
              esac
            done <<< "$changed"

            if [[ "$everything" == true ]]; then
              for s in "${all_ids[@]}"; do add "$s" "$PR_VARIANT"; done
            else
              for s in $targeted; do add "$s" "$PR_VARIANT"; done
              if [[ "$pipeline" == true ]]; then
                for p in "$PLAIN" "$EXPECT" "$UPGRADE" "$MULTI" "$CHAIN"; do
                  s="$(one_of "$p")"; [[ -n "$s" ]] && add "$s" "$PR_VARIANT"
                done
              fi
              [[ "$env_only" == true ]] && add "$SMOKE" "$PR_VARIANT"
            fi
            # A smoke test is enough here: the build path is shared by every
            # scenario, so if it works for one it works for all.
            [[ "$source_build" == true ]] && add "$SMOKE" "$SRC_VARIANT"
          else
            for s in "${all_ids[@]}"; do add_all_variants "$s"; done
          fi

          # Empty selection means everything -- the dispatch filters.
          selected() {
            local id="$1" want
            [[ -z "${2// /}" ]] && return 0
            for want in ${2//,/ }; do [[ "$want" == "$id" ]] && return 0; done
            return 1
          }

          scenarios='[]'
          for f in test_scenarios/*.yaml; do
            id="$(basename "$f" .yaml)"
            selected "$id" "$WANT_SCENARIOS" || continue
            ids=""
            for v in ${SEL[$id]:-}; do ids+="$v "; done
            [[ -n "${ids// /}" ]] || continue
            # variants is a JSON string: the reusable workflow takes it as one
            # input and fromJson's it, which lets each scenario have its own set.
            vjson="$(jq -c --arg ids "$ids" \
              '[ .[] | select(.id as $i | ($ids | split(" ") | index($i))) ]' <<< "$ALL")"
            # The two upgrade steps are no-ops for most scenarios. These mirror
            # the guards the scripts themselves use, so CI greys the steps out
            # instead of reporting a pass for work it never did.
            up="$(yq -r '((.upgrade // "" | tag) == "!!map")
                         and (([.upgrade.steps[]?] | length) == 0)' "$f")"
            ch="$(yq -r '([.upgrade.steps[]?] | length) > 0' "$f")"
            scenarios="$(jq -c --arg id "$id" --arg v "$vjson" \
              --argjson up "$up" --argjson ch "$ch" \
              '. + [{id: $id, variants: $v, upgrade: $up, chain: $ch}]' <<< "$scenarios")"
          done

          # Nothing to run is normal for a docs-only pull request, but for a
          # manual run it means the filters matched nothing and the run would go
          # green having tested nothing.
          if [[ "$scenarios" == '[]' && "$EVENT" == "workflow_dispatch" ]]; then
            echo "Nothing matches scenarios='$WANT_SCENARIOS'" >&2
            echo "Available: ${all_ids[*]}" >&2
            exit 1
          fi

          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.id): \(.variants | fromjson | map(.id) | join(", "))"' <<< "$scenarios"

  e2e:
    name: ${{ matrix.scenario.id }}
    needs: discover
    # A docs-only pull request selects nothing.
    if: needs.discover.outputs.scenarios != '[]'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(needs.discover.outputs.scenarios) }}
    uses: ./.github/workflows/e2e-scenario.yml
    with:
      scenario: ${{ matrix.scenario.id }}
      kcm_variants: ${{ matrix.scenario.variants }}
      has_upgrade: ${{ matrix.scenario.upgrade }}
      has_chain: ${{ matrix.scenario.chain }}
      src_url: ${{ github.event.inputs.SRC_URL || '' }}
      oci_url: ${{ github.event.inputs.OCI_URL || '' }}
