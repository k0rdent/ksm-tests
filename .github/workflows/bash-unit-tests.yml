name: Bash Unit Tests

on:
  push:
    paths:
      - 'scripts/**'
      - .github/workflows/bash-unit-tests.yml
  pull_request:
    paths:
      - 'scripts/**'
      - .github/workflows/bash-unit-tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  bash-tests:
    name: bash tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # test_apply_release.sh exercises the Release trimming, which needs yq.
      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run bash unit tests
        run: ./scripts/tests/bash/run.sh
