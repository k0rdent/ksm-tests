# Minimal Management. The provider list is rendered by apply_management.sh,
# which also injects the Helm values into core.kcm.config.
# NOTE: envsubst also expands variables inside comments -- keep them out.
apiVersion: k0rdent.mirantis.com/v1beta1
kind: Management
metadata:
  name: kcm
spec:
  release: ${RELEASE_NAME}
  core:
    kcm:
      config: {}
    capi: {}
  providers:
${MANAGEMENT_PROVIDERS}
