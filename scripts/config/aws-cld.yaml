apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: CLD_NAME
  namespace: kcm-system
  labels:
    type: aws
    group: demo
spec:
  template: CT_AWS_STANDALONE_CP
  credential: aws-credential
  config:
    controlPlane:
      # .small is two burstable vCPUs and 2 GiB, which catalog's one-app demo
      # fits. A serial run is a dozen helm installs and uninstalls against the
      # same control plane, and on .small it degrades as the run goes on until
      # the apiserver stops completing TLS handshakes.
      instanceType: AWS_EC2_FAMILY.medium
    controlPlaneNumber: 1
    publicIP: false
    region: AWS_REGION
    worker:
      instanceType: AWS_EC2_FAMILY.medium
      rootVolumeSize: 16
    workersNumber: 1
