# CAPD needs no real cloud credentials, but KCM requires every
# ClusterDeployment to reference a Credential. This is the stub trio KCM's own
# dev setup uses (config/dev/docker-credentials.yaml): an empty Secret, a
# Credential pointing at it, and the Sveltos resource template.
apiVersion: v1
kind: Secret
metadata:
  name: docker-cluster-secret
  namespace: ${NAMESPACE}
  labels:
    k0rdent.mirantis.com/component: "kcm"
type: Opaque
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: Credential
metadata:
  name: docker-stub-credential
  namespace: ${NAMESPACE}
spec:
  description: Docker (CAPD) stub credential
  identityRef:
    apiVersion: v1
    kind: Secret
    name: docker-cluster-secret
    namespace: ${NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-cluster-credential-resource-template
  namespace: ${NAMESPACE}
  labels:
    k0rdent.mirantis.com/component: "kcm"
  annotations:
    projectsveltos.io/template: "true"
