# MultiClusterService, following the shape k0rdent/catalog generates for its
# example apps. clusterSelector matches the label deploy_cld.sh puts on the
# ClusterDeployment, and that label is per-run so parallel runs never target
# each other's clusters.
# NOTE: envsubst also expands variables inside comments -- keep them out.
apiVersion: k0rdent.mirantis.com/v1beta1
kind: MultiClusterService
metadata:
  name: ${SERVICE_NAME}-${CLUSTER_NAME_SUFFIX}
spec:
  clusterSelector:
    matchLabels:
      group: ${CLD_GROUP_LABEL}
  serviceSpec:
    services:
      - template: ${SERVICE_TEMPLATE_NAME}
        name: ${SERVICE_NAME}
        namespace: ${SERVICE_NAMESPACE}
