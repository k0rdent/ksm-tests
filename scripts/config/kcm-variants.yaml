# The KCM builds every scenario is tested against.
#
# Single source of truth: scripts/lib/common.sh resolves KCM=<id> from here for
# local runs, and the CI discover job generates its matrix from the same file.
# Adding a version is a change to this file alone -- no workflow edit.
#
# The ids are what scenario files reference in their knownFailures, so a unit
# test asserts every referenced id exists here.
variants:
  # Built from a checkout -- tests the code under review.
  - id: src-main
    name: 'src: main'
    mode: source
    ref: main

  # Published charts -- tests what users actually install.
  #
  # prCheck marks the one variant pull requests run against: a published chart
  # cannot move under a PR, so a red leg means the change broke something rather
  # than upstream having shifted. The full matrix runs on main and nightly.
  - id: rel-1-11-0
    name: 'release: 1.11.0'
    mode: release
    version: '1.11.0'
    prCheck: true

  - id: rel-1-10-0
    name: 'release: 1.10.0'
    mode: release
    version: '1.10.0'
