# Kubeconfig of the cluster being adopted, plus the Credential pointing at it.
# KCM copies credential.identityRef.name into the chart's clusterIdentity, which
# the adopted-cluster chart uses as the SveltosCluster kubeconfigName -- so the
# Secret name here is what sveltos ends up reading.
# NOTE: envsubst expands variables inside comments too, so keep them out.
apiVersion: v1
kind: Secret
metadata:
  name: ${ADOPTED_SECRET_NAME}
  namespace: ${NAMESPACE}
  labels:
    k0rdent.mirantis.com/component: "kcm"
type: Opaque
data:
  value: ${ADOPTED_KUBECONFIG_B64}
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: Credential
metadata:
  name: ${ADOPTED_CREDENTIAL_NAME}
  namespace: ${NAMESPACE}
spec:
  description: Kubeconfig of the adopted cluster
  identityRef:
    apiVersion: v1
    kind: Secret
    name: ${ADOPTED_SECRET_NAME}
    namespace: ${NAMESPACE}
