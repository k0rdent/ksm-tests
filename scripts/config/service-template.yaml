# HelmRepository + ServiceTemplate for the service under test.
#
# k0rdent/catalog installs these through its kgst chart; this project writes
# the two objects directly so it does not depend on the catalog's releases.
# NOTE: envsubst also expands variables inside comments -- keep them out.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ${SERVICE_NAME}
  namespace: ${NAMESPACE}
  labels:
    # KCM runs flux with --watch-label-selector=k0rdent.mirantis.com/managed=true.
    # Without this label source-controller never sees the repository, and the
    # HelmChart fails with a misleading "HelmRepository not found".
    k0rdent.mirantis.com/managed: "true"
spec:
  interval: 10m0s
  url: ${SERVICE_HELM_REPO}
---
apiVersion: k0rdent.mirantis.com/v1beta1
kind: ServiceTemplate
metadata:
  name: ${SERVICE_TEMPLATE_NAME}
  namespace: ${NAMESPACE}
spec:
  helm:
    chartSpec:
      chart: ${SERVICE_CHART}
      version: ${SERVICE_CHART_VERSION}
      interval: 10m0s
      sourceRef:
        kind: HelmRepository
        name: ${SERVICE_NAME}
