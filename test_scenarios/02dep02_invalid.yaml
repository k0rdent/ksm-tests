name: 02dep02_invalid
group: Service dependencies
description: >-
  Issue #2, scenario 2: a dependsOn chain whose middle service is invalid.
  The rollout must stop there -- everything before it stays deployed, the
  ServiceSet is stamped failed, and nothing behind it is ever installed.

# The failure is invalid *values*, not a missing image, on purpose. A bad image
# still produces a successful Helm release (the Deployment is created, the pods
# simply never start), so sveltos reports the service as deployed and the chain
# carries on -- which would not exercise the behaviour this scenario is about.
# Values that break the install fail the release itself, which is what blocks
# the dependants.
expect:
  failed: cert-manager
  # Deployed before the failure, and must survive it: no rollback.
  deployed:
    - traefik
  # Behind the failure in the graph, so they must never be installed.
  blocked:
    - kserve-crd
  # How long to keep watching after the failure before calling the blocked
  # services genuinely blocked rather than merely slow.
  graceSeconds: 120

services:
  - name: traefik
    chart: traefik
    version: 41.2.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: traefik
    waitForPods: traefik-

  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    dependsOn: traefik
    # replicaCount is an integer the chart passes straight to .spec.replicas.
    # A negative one is rejected -- by the chart's values schema if it has one,
    # by the API server otherwise -- so the release fails either way.
    values: |
      cert-manager:
        replicaCount: -1

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager
