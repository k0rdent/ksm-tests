name: 02dep02_invalid
group: Service dependencies
description: >-
  Issue #2, scenario 2: a dependsOn chain whose middle service is invalid.
  The rollout must stop there -- everything before it stays deployed, the
  ServiceSet is stamped failed, and nothing behind it is ever installed.

# Invalid values, not a missing image: a bad image still yields a successful
# release, so the chain would carry on and nothing would be tested.
expect:
  failed: cert-manager
  # Deployed before the failure, and must survive it: no rollback.
  deployed:
    - traefik
  # Behind the failure in the graph, so they must never be installed.
  blocked:
    - kserve-crd
  # Long enough to tell blocked from merely slow.
  graceSeconds: 120

services:
  - name: traefik
    chart: traefik
    version: 41.2.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: traefik
    waitForPods: traefik-

  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    dependsOn: traefik
    # A negative replica count is rejected, so the release fails.
    values: |
      cert-manager:
        replicaCount: -1

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager
