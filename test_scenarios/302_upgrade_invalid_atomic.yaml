name: 302_upgrade_invalid_atomic
group: Service upgrades
description: >-
  Issue #3, scenario 2: the same chain deploys cleanly, then one service gets
  an invalid upgrade with helmOptions.atomic set. Helm must undo it and leave
  the release on the previous healthy version, and the rest of the chain must
  not move.

# Unlike 202_svcdep_invalid there IS a previous healthy state to roll back to.
# atomic is set from the first deploy, not added at upgrade time: adding it
# later makes sveltos reinstall rather than upgrade.
helmOptions:
  atomic: true

upgrade:
  services:
    - name: cert-manager
      # A real version bump with one rejected value on top, so the upgrade is
      # what fails. crds.enabled is repeated because an override replaces.
      version: 1.21.1
      values: |
        cert-manager:
          crds:
            enabled: true
          replicaCount: -1
      # The self-management override, which carries the workaround above with
      # it. replicaCount is what the upgrade is supposed to trip over, so it
      # has to be repeated in both.
      valuesTestModeSelf: |
        cert-manager:
          # KCM owns the cert-manager CRDs in this cluster; see the note above.
          crds:
            enabled: false
          fullnameOverride: scenario-cert-manager
          replicaCount: -1
  expect:
    failed: cert-manager
    # After the rollback the release must be serving this chart version again,
    # healthy, rather than sitting in a failed upgrade.
    rolledBackTo: 1.20.2
    untouched:
      - traefik
      - kserve-crd

services:
  - name: traefik
    chart: traefik
    version: 41.2.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: traefik
    waitForPods: traefik-

  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    dependsOn: traefik
    waitForPods: cert-manager-
    # A cluster of its own has no cert-manager, so this copy has to bring the
    # CRDs. With atomic set helm waits for the release to come up, and without
    # them it never does -- the install sits in pending-install until the
    # timeout.
    values: |
      cert-manager:
        crds:
          enabled: true
    # Under self-management KCM runs its own cert-manager in this very cluster
    # and its helm release owns the CRDs, so this copy must not install them
    # and needs names of its own.
    valuesTestModeSelf: |
      cert-manager:
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager
