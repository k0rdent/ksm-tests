name: 05chain02_boundary
group: Sequential upgrades
description: >-
  Issue #5, scenario 2: the chain lists only the version already deployed, so
  it offers no upgrades at all. Any upgrade must be refused and the service
  must stay where it is.

templateChain:
  supportedTemplates:
    - version: 1.20.2      # deliberately no availableUpgrades

upgrade:
  steps:
    - version: 1.21.1
      expect: rejected
  # Long enough to tell a refusal from something merely slow.
  graceSeconds: 120

services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        # KCM runs its own cert-manager in this management cluster and its helm
        # release owns the CRDs, so this copy must not install them and needs
        # names of its own. Under self-management there is nowhere else to put
        # it.
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager
