name: 05chain01_no_chain
group: Sequential upgrades
description: >-
  Issue #5, scenario 1: several versions exist as ServiceTemplates but no
  ServiceTemplateChain constrains them. Moving the service straight to the
  latest version must simply work.

# Without a chain nothing is gated and any declared template is accepted.
upgrade:
  steps:
    - version: 1.21.1
      expect: applied

services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        crds:
          enabled: true
