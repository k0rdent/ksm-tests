name: 05chain01_no_chain
group: Sequential upgrades
description: >-
  Issue #5, scenario 1: several versions exist as ServiceTemplates but no
  ServiceTemplateChain constrains them. Moving the service straight to the
  latest version must simply work.

# Without a chain nothing is gated and any declared template is accepted.
upgrade:
  steps:
    - version: 1.21.1
      expect: applied

services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        # KCM runs its own cert-manager in this management cluster and its helm
        # release owns the CRDs, so this copy must not install them and needs
        # names of its own. Under self-management there is nowhere else to put
        # it.
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager
