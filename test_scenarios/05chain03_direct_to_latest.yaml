name: 05chain03_direct_to_latest
group: Sequential upgrades
description: >-
  Issue #5, scenario 3: the chain allows a direct jump to the latest version
  but nothing else. The intermediate version must be refused; the latest must
  be accepted.

templateChain:
  supportedTemplates:
    - version: 1.20.2
      availableUpgrades:
        - 1.21.1
    - version: 1.21.1

upgrade:
  graceSeconds: 120
  steps:
    # Not reachable per the chain, though its ServiceTemplate exists.
    - version: 1.20.3
      expect: rejected
    - version: 1.21.1
      expect: applied

services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        # KCM runs its own cert-manager in this management cluster and its helm
        # release owns the CRDs, so this copy must not install them and needs
        # names of its own. Under self-management there is nowhere else to put
        # it.
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager
