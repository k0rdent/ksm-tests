name: 03upg02_invalid_atomic
group: Service upgrades
description: >-
  Issue #3, scenario 2: the same chain deploys cleanly, then one service gets
  an invalid upgrade with helmOptions.atomic set. Helm must undo it and leave
  the release on the previous healthy version, and the rest of the chain must
  not move.

# Unlike 02dep02_invalid there IS a previous healthy state to roll back to.
# atomic is set from the first deploy, not added at upgrade time: adding it
# later makes sveltos reinstall rather than upgrade.
helmOptions:
  atomic: true

# 1.11.0 and main roll back correctly; only 1.10.0 does not.
knownFailures:
  - kcm: rel-1-10-0
    step: Upgrade services
    match: was removed instead of rolled back
    timeout: 300
    reason: >-
      The release is deleted rather than returned to the previous healthy
      version that issue #3 scenario 2 asks for. Helm upgrades to 1.21.1, that
      fails on the rejected replicaCount, and 1.10.0 then tears the release down
      instead of rolling it back -- which is what atomic does on a failed
      install, where there is no earlier revision, not on a failed upgrade,
      where there is one. 1.11.0 and main roll back correctly, so the assertion
      itself still holds them to it. 1.10.0 ships sveltos v1.9.0 against v1.12.0
      in 1.11.0.
      Until the maxHistory default was added this leg failed one step earlier
      instead: the rollback ran, put the release back on 1.20.2 but left it
      'failed', and KCM retried in a loop up to revision 13. Which of the
      upgradeOptions moved it to a delete was not established.

upgrade:
  services:
    - name: cert-manager
      # A real version bump with one rejected value on top, so the upgrade is
      # what fails. crds.enabled is repeated because an override replaces.
      version: 1.21.1
      values: |
        cert-manager:
          crds:
            enabled: true
          replicaCount: -1
  expect:
    failed: cert-manager
    # After the rollback the release must be serving this chart version again,
    # healthy, rather than sitting in a failed upgrade.
    rolledBackTo: 1.20.2
    untouched:
      - traefik
      - kserve-crd

services:
  - name: traefik
    chart: traefik
    version: 41.2.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: traefik
    waitForPods: traefik-

  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    dependsOn: traefik
    waitForPods: cert-manager-
    values: |
      cert-manager:
        crds:
          enabled: true

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager
