name: 03upg02_invalid_atomic
group: Service upgrades
description: >-
  Issue #3, scenario 2: the same chain deploys cleanly, then one service gets
  an invalid upgrade with helmOptions.atomic set. Helm must undo it and leave
  the release on the previous healthy version, and the rest of the chain must
  not move.

# The difference from 02dep02_invalid is that here there IS a previous healthy
# state. An install with no prior revision has nothing to roll back to; only a
# failed *upgrade* can be undone, which is what atomic is for.
#
# atomic is set from the very first deploy, not introduced at upgrade time:
# the issue describes it as provider configuration, and adding it later changes
# the service spec enough that sveltos uninstalls and reinstalls rather than
# upgrading -- which would make the rollback untestable.
helmOptions:
  atomic: true

# 1.11.0 and main roll back correctly; only 1.10.0 does not.
knownFailures:
  - kcm: rel-1-10-0
    step: Upgrade services
    match: did not roll back to a healthy state
    timeout: 300
    reason: >-
      The rollback is attempted but does not succeed, so the service never
      returns to the previous healthy state that issue #3 scenario 2 asks for.
      Helm upgrades to 1.21.1, that fails on the rejected replicaCount, and the
      rollback to 1.20.2 then fails itself with 'original object Role with the
      name "cert-manager-tokenrequest" not found' -- the failed upgrade already
      removed a resource the rollback needs to restore. The release is left on
      1.20.2 in state failed and KCM retries in a loop, climbing revisions
      without ever recovering. Fixed in 1.11.0.

upgrade:
  services:
    - name: cert-manager
      # A real version bump, as in 03upg01_valid, with one rejected value on
      # top: the upgrade is what fails, not a bare values edit. crds.enabled is
      # repeated because an override replaces the original block outright, and
      # only replicaCount should differ from the healthy deployment.
      version: 1.21.1
      values: |
        cert-manager:
          crds:
            enabled: true
          replicaCount: -1
  expect:
    failed: cert-manager
    # After the rollback the release must be serving this chart version again,
    # healthy, rather than sitting in a failed upgrade.
    rolledBackTo: 1.20.2
    untouched:
      - traefik
      - kserve-crd

services:
  - name: traefik
    chart: traefik
    version: 41.2.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: traefik
    waitForPods: traefik-

  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    dependsOn: traefik
    waitForPods: cert-manager-
    values: |
      cert-manager:
        crds:
          enabled: true

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager
