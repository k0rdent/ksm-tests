name: 05chain04_stepwise
group: Sequential upgrades
description: >-
  Issue #5, scenario 4: the chain defines the path 1.20.2 -> 1.20.3 -> 1.21.1.
  Asking for the latest must walk through the intermediate version rather than
  jumping straight there.

# KNOWN FAILURE on KCM 1.11.0, in "Upgrade along the chain": the release goes
# straight from 1.20.2 to 1.21.1 in one helm upgrade instead of passing through
# the intermediate version. The chain is valid and all three templates exist,
# and 05chain02/03 show it *is* consulted -- so it constrains which versions
# may be reached, not the route. Contrary to issue #5 scenario 4.

templateChain:
  supportedTemplates:
    - version: 1.20.2
      availableUpgrades:
        - 1.20.3
    - version: 1.20.3
      availableUpgrades:
        - 1.21.1
    - version: 1.21.1

upgrade:
  steps:
    - version: 1.21.1
      expect: applied
      # Checked against helm history: watching for it live would be a race.
      viaVersions:
        - 1.20.3

services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        # KCM runs its own cert-manager in this management cluster and its helm
        # release owns the CRDs, so this copy must not install them and needs
        # names of its own. Under self-management there is nowhere else to put
        # it.
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager
