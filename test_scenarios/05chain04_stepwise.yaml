name: 05chain04_stepwise
group: Sequential upgrades
description: >-
  Issue #5, scenario 4: the chain defines the path 1.20.2 -> 1.20.3 -> 1.21.1.
  Asking for the latest must walk through the intermediate version rather than
  jumping straight there.

# The release goes straight from 1.20.2 to 1.21.1 in one helm upgrade. The
# chain is valid and all three templates exist, and 05chain02/03 show it *is*
# consulted -- so it constrains which versions may be reached, not the route.
knownFailures:
  - kcm: rel-1-10-0
    step: Upgrade along the chain
    match: the chain says it must step through it
    timeout: 300
    reason: >-
      The upgrade jumps straight to the latest version instead of passing
      through the intermediate one the chain defines, contrary to issue #5
      scenario 4.
  - kcm: rel-1-11-0
    step: Upgrade along the chain
    match: the chain says it must step through it
    timeout: 300
    reason: Same as rel-1-10-0; reproduced.
  - kcm: src-main
    step: Upgrade along the chain
    match: the chain says it must step through it
    timeout: 300
    reason: Same as rel-1-10-0; inferred, not yet run.

templateChain:
  supportedTemplates:
    - version: 1.20.2
      availableUpgrades:
        - 1.20.3
    - version: 1.20.3
      availableUpgrades:
        - 1.21.1
    - version: 1.21.1

upgrade:
  steps:
    - version: 1.21.1
      expect: applied
      # Checked against helm history: watching for it live would be a race.
      viaVersions:
        - 1.20.3

services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        crds:
          enabled: true
