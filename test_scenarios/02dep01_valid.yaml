name: 02dep01_valid
group: Service dependencies
description: >-
  A valid dependsOn chain: cert-manager provides the webhook certificates, the
  CRDs must exist before the controller. Same chain as catalog's apps/kserve.
  Issue #2, scenario 1: every service is valid, so all of them must land.

# KNOWN FAILURE on KCM 1.11.0, in "Remove services": teardown removes
# kserve-crd before uninstalling kserve-resources, whose release still holds a
# ClusterStorageContainer, so the uninstall fails with "ensure CRDs are
# installed first" and the MCS finalizer never clears. Fixed between v1.11.0
# and v1.12.0-rc1; main is unaffected.

# Charts come from k0rdent/catalog's registry. Those are thin wrappers that
# declare the upstream chart as a dependency of the same name, so values are
# nested one level under that name, exactly as catalog's own example does.
services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        # KCM runs its own cert-manager in this management cluster and its helm
        # release owns the CRDs, so this copy must not install them and needs
        # names of its own. Under self-management there is nowhere else to put
        # it.
        crds:
          enabled: false
        fullnameOverride: scenario-cert-manager

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager

  - name: kserve-resources
    chart: kserve-resources
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: kserve-crd
    waitForPods: kserve-controller-manager-
    values: |
      kserve-resources:
        kserve:
          controller:
            deploymentMode: Standard
            gateway:
              disableIstioVirtualHost: true
              disableIngressCreation: true
