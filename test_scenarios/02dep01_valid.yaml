name: 02dep01_valid
group: Service dependencies
description: >-
  A valid dependsOn chain: cert-manager provides the webhook certificates, the
  CRDs must exist before the controller. Same chain as catalog's apps/kserve.
  Issue #2, scenario 1: every service is valid, so all of them must land.

# KCM versions where this scenario is known to fail. CI still runs the leg and
# still reports it, but it does not block the workflow. Drop an entry once the
# defect is fixed upstream.
knownFailures:
  - kcm: rel-1-11-0
    # step and match keep the marker narrow: it excuses this defect in this
    # step only, so the leg still goes red if it breaks for any other reason.
    step: Remove services
    match: ensure CRDs are installed first
    timeout: 300
    reason: >-
      Teardown removes kserve-crd before uninstalling kserve-resources, whose
      release still holds a ClusterStorageContainer, so the uninstall fails with
      "ensure CRDs are installed first" and the MCS finalizer never clears.
      1.10.0 and main are unaffected; catalog does not test this path at all.

# Charts come from k0rdent/catalog's registry. Those are thin wrappers that
# declare the upstream chart as a dependency of the same name, so values are
# nested one level under that name, exactly as catalog's own example does.
services:
  - name: cert-manager
    chart: cert-manager
    version: 1.20.2
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: cert-manager
    waitForPods: cert-manager-
    values: |
      cert-manager:
        crds:
          enabled: true

  - name: kserve-crd
    chart: kserve-crd
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: cert-manager

  - name: kserve-resources
    chart: kserve-resources
    version: v0.18.0
    repo: oci://ghcr.io/k0rdent/catalog/charts
    namespace: kserve
    dependsOn: kserve-crd
    waitForPods: kserve-controller-manager-
    values: |
      kserve-resources:
        kserve:
          controller:
            deploymentMode: Standard
            gateway:
              disableIstioVirtualHost: true
              disableIngressCreation: true
